<!doctype html>
<html lang="de" data-qb-installed="true"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">Urlaub in Teilzeit Rechner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-wrapper">
    <div class="calculator-container">
      <h1 id="page-title-heading">Urlaub in Teilzeit Rechner</h1>
      <p class="subtitle">Berechnen Sie Ihren Urlaubsanspruch bei Teilzeitbeschäftigung</p>

      <form id="calculator-form" novalidate="">

        <!-- Urlaubsanspruch Vollzeit -->
        <div class="form-group">
          <label for="vollzeit-urlaub">Urlaubsanspruch bei Vollzeit (Arbeitstage)</label>
          <input type="number" id="vollzeit-urlaub" min="1" max="365" placeholder="z. B. 30">
        </div>

        <!-- Regelarbeitswoche -->
        <div class="form-group">
          <label>Regelarbeitswoche bei Vollzeit</label>
          <div class="radio-wrapper">
            <label class="radio-group" for="woche-5">
              <input type="radio" id="woche-5" name="vollzeit-woche" value="5" checked="">
              5-Tage-Woche
            </label>
            <label class="radio-group" for="woche-6">
              <input type="radio" id="woche-6" name="vollzeit-woche" value="6">
              6-Tage-Woche
            </label>
          </div>
        </div>

        <!-- Wochen-Arbeitstage Teilzeit -->
        <div class="form-group">
          <label for="teilzeit-tage">Wochen-Arbeitstage bei Teilzeit</label>
          <select id="teilzeit-tage">
            <option value="">Bitte wählen …</option>
            <option value="1">1 Tag pro Woche</option>
            <option value="2">2 Tage pro Woche</option>
            <option value="3">3 Tage pro Woche</option>
            <option value="4">4 Tage pro Woche</option>
            <option value="5">5 Tage pro Woche</option>
            <option value="6">6 Tage pro Woche</option>
          </select>
        </div>

        <div id="error-message" class="error-message" role="alert"></div>

        <div class="button-group">
          <button type="button" id="calculate-btn" class="btn-calculate">Berechnen</button>
          <button type="button" id="reset-btn" class="btn-reset">Zurücksetzen</button>
        </div>
      </form>

      <!-- Ergebnis -->
      <div id="results" class="result-section" role="region" aria-live="polite">
        <div class="result-item">
          <div class="result-label">Urlaubsanspruch bei Teilzeit</div>
          <div class="result-value" id="teilzeit-urlaub">– Tage</div>
        </div>
        <div id="info-box" class="info-box"></div>
        <div id="warning-box" class="warning-box" style="display:none;"></div>
      </div>

    </div>
  </div>
  <script src="script.js"></script>


</body></html>
